<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>

<body>
    <div class="wrapper">
        <p id="display" class="display"></p>
        <div class="button-grid">
            <button id="button_seven">7</button><button id="button_eight">8</button><button
                id="button_nine">9</button><button id="button_plus">+</button>
            <button id="button_four">4</button><button id="button_five">5</button><button
                id="button_six">6</button><button id="button_minus">-</button>
            <button id="button_one">1</button><button id="button_two">2</button><button
                id="button_three">3</button><button id="button_asterix">*</button>
            <button id="button_zero">0</button><button id="button_clear">C</button><button
                id="button_equal">=</button><button id="button_slash">/</button>
        </div>
    </div>
</body>

</html>
