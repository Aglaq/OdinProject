<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="header">
        <div class="search">
          <img src="" alt="magnifying" width="30" height="30" />
          <form role="search" action="/search" method="get">
            <label for="search-input"></label>
            <input type="search" id="search-input" name="q" />
          </form>
        </div>
        <div class="profile">
          <img src="" alt="bell" width="30" height="30" />
          <img src="" alt="profile" width="50" height="50" />
          <p>Firstname Lastname</p>
        </div>
        <div class="welcome">
          <img src="" alt="profile" width="50" height="50" />
          <div class="hello">Hi there,</div>
          <div class="person-data">Firstname Lastname (@tag)</div>
        </div>
        <div class="buttons">
          <button type="button">New</button>
          <button type="button">Upload</button>
          <button type="button">Share</button>
        </div>
      </div>
      <div class="sidebar">
        <div class="logo">
          <img src="" alt="logo" width="50" height="50" />
          <p>Dashboard</p>
        </div>
        <div class="list">
          <ul>
            <li>Home</li>
            <li>Profile</li>
            <li>Messages</li>
            <li>History</li>
            <li>Tasks</li>
            <li>Communities</li>
          </ul>
        </div>
        <div class="list">
          <ul>
            <li>Settings</li>
            <li>Support</li>
            <li>Privacy</li>
          </ul>
        </div>
      </div>
      <div class="main">
        <p>main</p>
      </div>
    </div>
  </body>
</html>
