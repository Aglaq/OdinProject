<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Odin Sign-up Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <div class="left-side">
        <img
          class="background-image"
          src="./images/beach.jpg"
          width="800"
          height="auto"
        />
        <div class="logo">
          <img id="odin-logo" src="./images/logo.png" />
          <p id="odin">ODIN</p>
        </div>
        <p class="text-overlay">Photo by Maarten van den Heuvel on Unsplash</p>
      </div>
      <div class="right-side">
        <div class="part intro">
          <p>
            This is not a real online service! You know you need something like
            this in your life to help you realize your deepest dreams. Sign up
            <i>now</i> to get started.
          </p>
          <p>You <i>know</i> you want to.</p>
        </div>
        <div class="part main">
          <p>Let's do this!</p>
          <form action="#" method="post">
            <div class="form">
              <div class="column">
                <div class="form-group">
                  <label for="first_name">FIRST NAME</label>
                  <input type="text" id="first_name" name="first_name" />
                </div>
                <div class="form-group">
                  <label for="user_email">EMAIL</label>
                  <input type="email" id="user_email" name="user_email" />
                </div>
                <div class="form-group">
                  <label for="user_password">PASSWORD</label>
                  <input
                    type="password"
                    id="user_password"
                    name="user_password"
                    minlength="8"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}"
                    title="Must contain at least one number, one lowercase letter, one uppercase letter, and one special sign. (min. 8 characters)"
                    required
                  />
                </div>
              </div>
              <div class="column">
                <div class="form-group">
                  <label for="last_name">LAST NAME</label>
                  <input type="text" id="last_name" name="last_name" />
                </div>
                <div class="form-group">
                  <label for="user_phone_number">PHONE NUMBER</label>
                  <input
                    type="tel"
                    id="user_phone_number"
                    name="user_phone_number"
                  />
                </div>
                <div class="form-group">
                  <label for="confirm_user_password">CONFIRM PASSWORD</label>
                  <input
                    type="password"
                    id="confirm_user_password"
                    name="confirm_user_password"
                    minlength="8"
                    pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*]).{8,}"
                    title="Must contain at least one number, one lowercase letter, one uppercase letter, and one special sign. (min. 8 characters)"
                    required
                  />
                </div>
              </div>
            </div>
          </form>
        </div>
        <div class="part outro">
          <button>Create Account</button>
          <p class="have_an_account">
            Already have an account? <a href="url">Log in</a>
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
